; ===========================================================================
;  CANnula Clinical Workstation v0.0.2 (강화) — 사이트 설정
;
;  v0.0.1 과 달라진 점
;    - 계정 비밀번호는 scrypt 해시로만 들어간다 (평문 없음).
;    - 게이트웨이 실행 경로·추가 인자를 설정으로 정할 수 없다 (코드 고정).
;    - 제어 포트 바인드 주소를 설정으로 넓힐 수 없다 (루프백 고정).
;    - 진단 도구 명령줄을 설정으로 정할 수 없다 (허용 목록 고정).
;    - 업데이트 서버는 HTTPS 만 허용한다.
;    - 가드레일 상한은 설정이 아니라 빌드에 고정돼 있다.
; ===========================================================================

[site]
name          = 특수병원 3동 중환자실
ward          = ICU-3
workstation   = WS-ICU3-02

[bridge]
; 전송 방식: slcan(USB-CAN 어댑터, 기본) | sim(내장 시뮬레이터) | udp(가상 CAN)
; serial = auto 면 붙어 있는 어댑터를 찾아 쓴다. 특정 포트를 고정하려면 COM3 처럼 적는다.
transport     = slcan
serial        = auto
bitrate       = 500
port          = 47100

[users]
; 형식: 사용자 = scrypt$N$r$p$salt-b64$hash-b64$role
; 역할: nurse (레벨 1) | tech, admin (레벨 2)
; 데모 비밀번호는 네 계정 모두 password (deploy/signing/demo-accounts.txt)
nurse.kim     = scrypt$16384$8$1$QucAl/JD3odYcwxritm+2g==$EK5i6QVLBwzjm+AyLYN52juDueAopKmS+lW9mznYwbE=$nurse
nurse.lee     = scrypt$16384$8$1$ay7KGha46aCBt23X2XDgvA==$fUi5cVLyCKDWhRl2Q3Hy2VDxZAdKOZnXXE0NWQZm9pw=$nurse
tech.park     = scrypt$16384$8$1$0d5XmNSpszV07aZjjb4q/g==$Bha3pWN4aTDM15dFzHKYUcdXepPNrPxAuGjvcNU7+54=$tech
admin         = scrypt$16384$8$1$h2f9LmbOjAv43VATAjEoDA==$91AydJWO8kJ7SfoXMBioLnSNJO3u+T7S8WIwCY8wphY=$admin

[update]
; HTTPS 만 허용한다. 매니페스트와 패키지 모두 서명을 검증한다.
base_url      = https://cannula.special-partners.com
channel       = stable

[logging]
level         = info
retain_days   = 30
