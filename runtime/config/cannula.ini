; ===========================================================================
;  CANnula Clinical Workstation — 사이트 설정
;
;  설치 폴더의 config\cannula.ini 를 앱 시작 시 읽는다.
;  값을 바꾸면 앱을 다시 시작해야 적용된다.
; ===========================================================================

[site]
name          = 특수병원 3동 중환자실
ward          = ICU-3
workstation   = WS-ICU3-02

[bridge]
; CAN 게이트웨이(CANnulaBridge) 실행/연결 설정.
autostart     = true
exe           = CANnulaBridge.exe
; UI 접속을 받을 주소. 옆 병동 워크스테이션에서도 같은 펌프를 보게 하려면
; 0.0.0.0 으로 열어 둔다.
bind          = 0.0.0.0
port          = 47100
connect_host  = 127.0.0.1
; 전송 방식: slcan(USB-CAN 어댑터, 기본) | sim(내장 시뮬레이터) | udp(가상 CAN)
; serial = auto 면 붙어 있는 어댑터를 찾아 쓴다. 특정 포트를 고정하려면 COM3 처럼 적는다.
transport     = slcan
serial        = auto
bitrate       = 500
udp_listen    = 47101
udp_peer      =
verbose       = false
extra_args    =

[ders]
; 용량 오류 감소 시스템(가드레일). 기사용 해제 코드는 서비스 매뉴얼과 같다.
soft_max_mlh  = 200
hard_max_mlh  = 999
override_code = OVERRIDE

[users]
; 로그인 계정. 병동 인수인계용으로 공용 계정을 쓴다.
nurse.kim     = password:nurse
nurse.lee     = password:nurse
tech.park     = password:tech
admin         = password:admin

[update]
base_url      = http://cannula.special-partners.com
channel       = stable
auto_check    = true

[service]
; 서비스 기사용 진단 도구. 앱의 진단 화면에서 호출한다.
selftest      = CANnulaBridge.exe --selftest
ping          = ping -n 2 127.0.0.1
netstat       = netstat -ano

[logging]
level         = info
retain_days   = 30
